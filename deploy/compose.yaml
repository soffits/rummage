# Indexes Seafile libraries next to the Seafile server and answers searches over HTTP.
services:
  rummage:
    image: ghcr.io/soffits/rummage:0.1
    restart: unless-stopped
    environment:
      RUMMAGE_CONFIG: /run/rummage.toml
      RUMMAGE_TOKEN: ${RUMMAGE_TOKEN:?set a search API token}
      SEAFILE_TOKEN: ${SEAFILE_TOKEN:?set a read-only Seafile account token}
    configs:
      - source: rummage_config
        target: /run/rummage.toml
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"

configs:
  rummage_config:
    content: |
      [runtime]
      threads = 2
      nice = 10

      [sources.files]
      type = "seafile"
      url = "https://cloud.example.com"
      internal_url = "http://seafile"   # fetch file bytes inside the Docker network
      token_env = "SEAFILE_TOKEN"
